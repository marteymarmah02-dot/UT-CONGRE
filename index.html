<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2A3B">
<meta name="description" content="A private, mobile-friendly congregation management workspace.">
<meta name="application-name" content="Congregation Manager">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Congregation Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A3B;--teal:#0F6B6E;--teal-d:#0B5457;--gold:#C9A24A;--bg:#F2F5F6;--card:#fff;--ink:#12222B;--mute:#5B6C75;--line:#DDE4E7;--bad:#B3402F;--ok:#2E7D5B;--warn:#9A6B00}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;margin:0;line-height:1.2;font-weight:700}
h1{font-size:1.55rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.mute{color:var(--mute)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#shell{display:flex;flex-direction:column;min-height:100dvh}
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.top b{font-family:'Source Serif 4',Georgia,serif;font-size:1.1rem}
.top small{opacity:.75}
.side{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mute)}
.bottom button.on{color:var(--teal);font-weight:700}
#main{flex:1;padding:16px 16px calc(90px + env(safe-area-inset-bottom));max-width:860px;width:100%;margin:0 auto}

@media(min-width:900px){
 #shell{flex-direction:row}
 .top{display:none}
 .bottom{display:none}
 .side{display:flex;flex-direction:column;width:250px;background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100dvh;gap:2px;overflow-y:auto}
 .side .brand{font-family:'Source Serif 4',Georgia,serif;font-size:1.25rem;font-weight:700;padding:0 10px 16px}
 .side .brand span{display:block;font-family:Figtree,sans-serif;font-size:.78rem;font-weight:400;opacity:.65;margin-top:2px}
 .side button{background:none;border:0;color:#cfdde3;display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;text-align:left}
 .side button:hover{background:rgba(255,255,255,.08)}
 .side button.on{background:rgba(201,162,74,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
 .side .who{margin-top:auto;padding:10px;font-size:.85rem;opacity:.8;word-break:break-all}
 #main{padding:28px 32px 48px}
}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1500}
.btn.danger{color:var(--bad);border-color:#e6c4be}
.btn.sm{padding:6px 11px;font-size:.88rem;border-radius:8px}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.srch input,.fld input,.fld select,.fld textarea,.tb select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.srch{margin-bottom:10px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tb select{flex:1;min-width:180px;width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;white-space:nowrap;color:var(--mute)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.rb{min-width:0;flex:1}
.rb h3{margin-bottom:2px;overflow-wrap:anywhere}
.rb p{color:var(--mute);font-size:.92rem;overflow-wrap:anywhere}
.rb p.strong{color:var(--ink);font-weight:600}
.rb p.warn{color:var(--bad);font-size:.88rem;margin-top:3px}
.rb a{color:var(--teal);font-weight:600}
.rr{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rr .ra{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:#e4eef0;color:var(--teal-d);white-space:nowrap}
.badge.gold{background:#f6ecd2;color:var(--warn)}
.badge.ok{background:#dcefe6;color:var(--ok)}
.badge.bad{background:#f5dcd7;color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:34px 12px;border:1px dashed var(--line);border-radius:12px;background:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin-bottom:10px}
.next{background:var(--navy);color:#fff;border:0;padding:20px}
.next h2{font-size:1.5rem}
.next .meta{opacity:.8;margin:4px 0 14px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.next .cap{font-size:.9rem;margin:8px 0 14px;opacity:.9}
.lr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;color:var(--ink)}
.lr:last-child{border-bottom:0}
.lr b{font-variant-numeric:tabular-nums}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--mute)}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.camp{margin-top:12px;font-size:.92rem}
.camp .bar{background:var(--line);margin-top:4px}
.camp .bar i{background:var(--teal)}
.spark{display:flex;align-items:flex-end;gap:5px;height:52px;margin:8px 0}
.spark i{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:3px}
.grid2{display:grid;gap:14px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}

.fld{margin-bottom:12px}
.fld label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px}
.chk label{font-weight:400;display:flex;align-items:center;gap:6px;margin:0}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(14,42,59,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
#modal .sheet{background:#fff;width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
#modal .sheet h2{margin-bottom:14px}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:.92rem}
@media(min-width:900px){#toast{bottom:28px}}

#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0 46%,var(--bg) 46%)}
.authcard{background:#fff;border-radius:16px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(14,42,59,.25)}
.authcard h1{margin-bottom:4px}
.authcard form{margin:16px 0 10px}
.err{color:var(--bad);background:#f9e6e2;padding:9px 11px;border-radius:8px;margin-top:10px;font-size:.92rem}
.link{background:none;border:0;color:var(--teal);font-weight:600;padding:6px 0;text-decoration:underline}
.alt{margin-top:8px}
.sect{margin-bottom:22px}
.sect p.mute{margin-bottom:10px;font-size:.92rem}
textarea.code{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;min-height:130px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
.urow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow select{padding:6px;border-radius:8px;border:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){#modal .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.row.hl{background:#fbf3df;border-color:#e6d3a0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:#eef3f4;font-weight:700}
.tbl tr[data-open]{cursor:pointer}
.tbl tr.next td{background:#fff3c2}
.tbl.grid td{min-width:100px;text-align:center;cursor:pointer;font-size:.82rem}
.tbl.grid td:first-child,.tbl.grid th:first-child{text-align:left;min-width:92px;position:sticky;left:0;background:#fff;z-index:1}
.tbl.grid td.has{background:#cfe7ea;font-weight:600}
.tbl.grid td.bad{background:#f5dcd7}
.tbl.grid tr.cur td:first-child{background:#fff3c2}
.acc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff}
.acc>summary::-webkit-details-marker{display:none}
.accb{padding:12px 12px 4px}
.sch{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:16px;margin-bottom:12px;color:#fff}
.sch h2{margin-bottom:6px}
.sch p{opacity:.92;font-size:.95rem}
.sch.c1{background:var(--teal)}
.sch.c2{background:#1f4e72}
.sch.c3{background:#8c6d22}
.sch.c4{background:#4b5f78}
#modal .sheet.edsheet{max-width:720px}
.edsec{color:#fff;margin:16px -18px 10px;padding:8px 18px;font-family:'Source Serif 4',Georgia,serif;font-weight:700;background:var(--navy)}
.edsec.t{background:var(--teal)}
.edsec.a{background:#8c6d22}
.edsec.l{background:#8c3b34}
.rowbox{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.rowhead{display:grid;grid-template-columns:1fr 72px auto;gap:6px;margin-bottom:8px}
.edsheet input:not([type=checkbox]),.edsheet select,.edsheet textarea{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;width:100%;background:#fff;color:var(--ink)}
.songs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.warnl{color:var(--bad);font-size:.84rem;margin-top:3px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.pwloc{font-weight:700}
.box{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;background:#fff;color:var(--ink)}
.box.res{border-color:var(--teal);color:var(--teal);font-weight:600;justify-content:center}
.slipbox p{margin:0 0 10px}
.slipbox b{display:block}
#printzone{display:none}
@media print{
 body.printing>*:not(#printzone){display:none!important}
 body.printing #printzone{display:block;padding:16px;color:#000;background:#fff;font-family:Georgia,serif}
 body.printing #printzone h2,body.printing #printzone h3{font-family:Georgia,serif;margin:12px 0 6px}
 body.printing #printzone p{margin:0 0 6px}
}
:root{--ac:#0E2A3B}
.top{background:var(--ac)}
.head h1{border-left:8px solid var(--ac);padding-left:10px}
.btn.pri{background:var(--ac);border-color:var(--ac)}
.btn.pri:hover{filter:brightness(.92)}
.chip.on{background:var(--ac);border-color:var(--ac)}
.row{border-left:6px solid var(--ac)}
.acc>summary{background:var(--ac)}
.badge{background:color-mix(in srgb,var(--ac) 14%,#fff);color:var(--ac)}
.card{border-top:4px solid var(--cc,var(--line))}
.card.next{border-top:0}
.bottom button.on{color:var(--ac)}
.sch.c1{background:#8c3b34}
.sch.c2{background:#1f4e72}
.sch.c3{background:#8a3b78}
.sch.c4{background:#4b3fa8}
.lit-root{--bg:#121212; --surface:#1A1A1A; --card:#232323; --card2:#2A2A2A;
  --accent:#D2691E; --accent-dim:#7A3D17; --banner-bg:#3A2413;
  --active-bg:#3D2015;
  --text:#FFFFFF; --muted:#9A9A9A; --muted2:#787878;
  --border:#2E2E2E; --ok:#3FA872; --ok-bg:#173324;
  --danger:#D9534F; --danger-bg:#3A1E1C;
  --tap:48px; --radius:14px;}
.lit-root *{box-sizing:border-box;}
.lit-root{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.lit-root button{font-family:inherit;cursor:pointer;}
.lit-root input,.lit-root select,.lit-root textarea{font-family:inherit;}
.lit-root :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.lit-root .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.lit-root .topbar{position:sticky; top:0; z-index:30; background:var(--bg);
  display:flex; align-items:center; gap:.6rem; padding:.7rem .8rem; min-height:60px;}
.lit-root .icon-sq{width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:var(--accent); border-radius:12px; flex-shrink:0; border:none; color:#fff;}
.lit-root .icon-sq svg{display:block;}
.lit-root .topbar-page{font-size:1.15rem; font-weight:700; margin-left:.1rem;}
.lit-root .scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s;}
.lit-root .scrim.open{opacity:1; pointer-events:auto;}
.lit-root .drawer{position:fixed; top:0; left:0; bottom:0; width:85%; max-width:340px; background:#161616;
  z-index:50; transform:translateX(-100%); transition:transform .22s ease; overflow-y:auto;}
.lit-root .drawer.open{transform:translateX(0);}
.lit-root .drawer-header{display:flex; align-items:flex-start; gap:.7rem; padding:1.1rem 1rem .3rem;}
.lit-root .drawer-brand-icon{width:44px; height:44px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff;}
.lit-root .drawer-brand-text{flex:1; line-height:1.2; padding-top:.1rem;}
.lit-root .drawer-brand-text .l1{font-weight:700; font-size:1.05rem; color:#fff;}
.lit-root .drawer-brand-text .l2{font-weight:700; font-size:1.05rem; color:var(--accent);}
.lit-root .drawer-close{width:36px; height:36px; border-radius:999px; background:#2A2A2A; display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0; border:none;}
.lit-root .drawer-cong{padding:.4rem 1rem 1rem; font-size:.78rem; color:var(--muted); letter-spacing:.02em;}
.lit-root .drawer-section{padding:1rem 1rem .4rem; font-size:11px; font-weight:800; letter-spacing:.09em; color:var(--muted2); text-transform:uppercase;}
.lit-root .drawer nav{padding-bottom:2rem;}
.lit-root .drawer-item{display:block; width:calc(100% - 1.2rem); margin:.15rem .6rem; text-align:left; padding:.85rem .9rem; min-height:var(--tap);
  color:#E6E6E6; font-size:1rem; border-radius:var(--radius); background:none; border:none;}
.lit-root .drawer-item.active{background:var(--active-bg); color:var(--accent); font-weight:700;}
.lit-root .drawer-item:not(.active):hover{background:#1F1F1F;}
.lit-root .wrap{max-width:640px; margin:0 auto; padding:.9rem .9rem 3rem;}
.lit-root .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700;}
.lit-root h1.page-title{font-size:2rem; font-weight:800; margin:.2rem 0 0;}
.lit-root .subtext{color:var(--muted); font-size:.9rem; margin-top:.35rem;}
.lit-root .banner{margin-top:1.1rem; background:var(--banner-bg); border-radius:999px; padding:1rem 1.3rem; font-size:.95rem; color:#fff;}
.lit-root .banner b{font-weight:700;}
.lit-root section{margin-top:1.7rem;}
.lit-root h2.section-title{font-size:1.05rem; font-weight:700; margin:0 0 .6rem;}
.lit-root .eyebrow-label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); font-weight:800; margin-bottom:.7rem;}
.lit-root .field-label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:.4rem; text-transform:uppercase; letter-spacing:.03em;}
.lit-root .field-select,.lit-root .field-input{width:100%; min-height:var(--tap); border-radius:var(--radius); background:var(--card2); border:1px solid var(--border);
  color:#fff; padding:0 .9rem; font-size:1rem;}
.lit-root .field-select:focus,.lit-root .field-input:focus{border-color:var(--accent);}
.lit-root .search-row{display:flex; gap:.5rem;}
.lit-root .search-row .field-input{flex:1;}
.lit-root .search-btn{width:var(--tap); height:var(--tap); border-radius:var(--radius); background:var(--card2); border:1px solid var(--border); color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.lit-root .qa-card{display:flex; align-items:center; justify-content:space-between; gap:.6rem; width:100%; text-align:left;
  min-height:64px; padding:1rem 1.1rem; border-radius:var(--radius); background:var(--card); border:none; margin-top:.7rem;}
.lit-root .qa-card .qa-title{font-weight:700; font-size:1rem; color:#fff;}
.lit-root .qa-card .qa-sub{font-size:.85rem; color:var(--muted); margin-top:.2rem;}
.lit-root .qa-card .chev{color:var(--muted2); font-size:1.3rem; flex-shrink:0;}
.lit-root .glance-row{display:flex; align-items:center; justify-content:space-between; min-height:56px; padding:1rem 1.1rem;
  border-radius:var(--radius); background:var(--card); margin-top:.7rem;}
.lit-root .glance-label{font-weight:700; font-size:1rem;}
.lit-root .glance-value{font-weight:800; font-size:1.4rem; color:var(--accent);}
.lit-root .cat-list{margin-top:.9rem;}
.lit-root .cat-item{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
  min-height:var(--tap); padding:.85rem 0; border-bottom:1px solid var(--border); color:#9DBEE8; font-size:1rem; background:none; border-left:none; border-right:none; border-top:none;}
.lit-root .cat-item .chev{color:var(--muted2);}
.lit-root .item-list{margin-top:.6rem; display:flex; flex-direction:column; gap:.55rem;}
.lit-root .item-card{display:flex; align-items:center; justify-content:space-between; gap:.6rem;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:.75rem .9rem;}
.lit-root .item-name{font-size:.92rem;}
.lit-root .item-sub{font-size:.75rem; color:var(--muted); margin-top:.1rem;}
.lit-root .add-btn{min-width:44px; min-height:36px; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:.85rem;
  padding:0 .8rem; border:none;}
.lit-root .lbtn{min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border-radius:var(--radius); padding:0 1.1rem; font-weight:700; font-size:.92rem; border:none;}
.lit-root .btn-primary{background:var(--accent); color:#fff;}
.lit-root .btn-primary:hover{background:#b85a19;}
.lit-root .btn-ghost{background:var(--card2); color:#fff; border:1px solid var(--border);}

const fmtDate=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'No date';

/* ---------- constants & schema ---------- */

 'Public Talk & Watchtower':[['Chairman','Chairman'],['Public talk','Talk'],['Watchtower Study conductor','Conductor'],['Watchtower Study reader','Reading'],['Closing prayer','Prayer']],

function conflicts(a){
 const out=[];if(!a.person)return out;

  if(o.id===a.id||o.person!==a.person)return;

/* ---------- storage layer ---------- */
const persist=c=>localStorage.setItem('cm_'+c,JSON.stringify(D[c]));
function loadLocal(){COLS.forEach(c=>{try{D[c]=JSON.parse(localStorage.getItem('cm_'+c)||'[]')}catch(e){D[c]=[]}})}
async function cloudSaveRec(c,o){
 if(c==='pwslot'&&!canEdit()){const {error:re}=await SB.rpc('cm_pw_reserve',{p_record:String(o.id),p_people:o.people||[]});if(re)throw re;return}
 const row={collection_name:c,record_id:String(o.id),payload:o,owner_email:PERSONAL.includes(c)?(o.owner||ME.email):null,updated_at:new Date().toISOString()};
 const {error}=await SB.from('app_records').upsert(row,{onConflict:'collection_name,record_id'});
 if(error)throw error;
}
function saveRec(c,o){
 const a=D[c],i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;
 if(MODE==='cloud'){cloudSaveRec(c,o).catch(err);return}
 persist(c);autoSnapshot();
}
function autoSnapshot(){
 try{const snap={app:'congregation-manager',version:3,automatic:true,savedAt:new Date().toISOString(),data:D};localStorage.setItem('cm_autobackup',JSON.stringify(snap))}catch(e){console.warn('Automatic local snapshot unavailable',e)}
}
async function delRec(c,id){
 D[c]=D[c].filter(x=>x.id!==id);
 if(MODE==='cloud'){const {error}=await SB.from('app_records').delete().eq('collection_name',c).eq('record_id',String(id));if(error){err(error);return}return}
 persist(c);autoSnapshot();
}

/* ---------- forms ---------- */
function optsOf(f){
 if(f.ref==='publishers')return D.publishers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.id,p.name]);
 if(f.ref==='groups')return D.groups.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(g=>[g.id,g.name]);
 if(f.ref==='whom')return D.publishers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>[p.id,p.name]).concat(D.groups.map(g=>[g.id,'Group: '+g.name]));
 if(f.ref==='campaigns')return D.campaigns.map(c=>[c.id,c.name]);
 if(f.ref==='pwloc')return D.pwloc.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(l=>[l.id,l.name+(l.code?' ('+l.code+')':'')]);
 if(f.ref==='meetings')return D.meetings.slice().sort(byDateAsc).map(m=>[m.id,meetLabel(m)]);
 return (f.o||[]).map(x=>[x,x]);
}
function fieldHTML(f,val){
 const id='f_'+f.k,v=val==null?'':val;let inp;
 if(f.t==='textarea')inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(f.t==='select')inp=`<select id="${id}"${f.req?' required':''}><option value="">${f.req?'Select':'None'}</option>${optsOf(f).map(([k,l])=>`<option value="${esc(k)}"${k===v?' selected':''}>${esc(l)}</option>`).join('')}</select>`+(f.ref&&!optsOf(f).length?`<p style="color:var(--bad);font-size:.88rem;margin-top:4px">${esc(emptyHint(f.ref))}</p>`:'');
 else if(f.t==='check')inp=`<label style="font-weight:400;display:flex;gap:8px;align-items:center"><input id="${id}" type="checkbox"${val?' checked':''}> Yes</label>`;
 else if(f.t==='multi')inp=`<div class="chk" id="${id}">${f.o.map(x=>`<label><input type="checkbox" value="${esc(x)}"${(val||[]).includes(x)?' checked':''}> ${esc(x)}</label>`).join('')}</div>`;
 else inp=`<input id="${id}" type="${f.t||'text'}" value="${esc(v)}"${f.req?' required':''}${f.t==='number'?' min="0" step="any"':''}>`;
 return `<div class="fld"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`;
}
function collect(S){
 const o={};
 S.fields.forEach(f=>{
  const el=$('#f_'+f.k);
  if(f.t==='check')o[f.k]=el.checked;
  else if(f.t==='multi')o[f.k]=[...el.querySelectorAll('input:checked')].map(i=>i.value);
  else if(f.t==='number')o[f.k]=el.value===''?'':Number(el.value);
  else o[f.k]=el.value.trim();
 });
 return o;
}
function openForm(col,id,preset){
 const S=SCHEMA[col];
 const rec=id?D[col].find(x=>x.id===id):Object.assign({},S.defaults||{},preset||{});
 modal(`<h2>${id?'Edit':'Add'} ${S.single}</h2><form id="frm">${S.fields.map(f=>fieldHTML(f,rec[f.k])).join('')}<div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn pri">Save ${S.single}</button></div></form>`);
 $('#frm').onsubmit=e=>{
  e.preventDefault();
  const o=Object.assign({},rec,collect(S));
  if(!o.id){o.id=uid();o.owner=o.owner||ME.email}o.updated=new Date().toISOString();
  if(S.check){const w=S.check(o);if(w.length&&!confirm('Check before saving:\n- '+w.join('\n- ')+'\n\nSave anyway?'))return}
  saveRec(col,o);closeModal();toast('Saved');render();
 };
}

/* ---------- list views ---------- */
const canMod=(col,r)=>canEdit()||(PERSONAL.includes(col)&&r.owner===ME.email);
function cardHTML(col,r){
 const S=SCHEMA[col],c=S.card(r);
 const acts=(c.acts||[]).map(([k,l])=>`<button class="btn sm" data-act="${k}" data-col="${col}">${l}</button>`).join('');
 const edit=canMod(col,r)?`<button class="btn sm" data-act="edit" data-col="${col}">Edit</button><button class="btn sm danger" data-act="del" data-col="${col}">Delete</button>`:'';
 return `<article class="row${c.hl?' hl':''}" data-id="${esc(r.id)}"><div class="rb"><h3>${esc(c.t)}</h3><p>${esc(c.s||'')}</p>${c.x||''}</div><div class="rr">${c.b?`<span class="badge ${c.bc||badgeCls(c.b)}">${esc(c.b)}</span>`:''}<div class="ra">${acts}${edit}</div></div></article>`;
}
function refreshList(){
 if(!CUR)return;const S=SCHEMA[CUR],el=$('#list');if(!el)return;
 const q=(Q[CUR]||'').toLowerCase(),chip=F[CUR]||(S.chips?S.chips[0]:'');
 const items=D[CUR].filter(r=>(!S.filter||S.filter(r))&&(!S.chips||S.chipFn(r,chip))&&(!q||S.text(r).join(' ').toLowerCase().includes(q)));
 items.sort(S.sort);
 el.innerHTML=items.length?items.map(r=>cardHTML(CUR,r)).join(''):`<div class="empty">${q?'Nothing matches your search.':S.empty}</div>`;
}
function vList(col,toolbar){
 const S=SCHEMA[col];CUR=col;
 const chips=S.chips?`<div class="chips">${S.chips.map(x=>`<button class="chip${(F[col]||S.chips[0])===x?' on':''}" data-chip="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'';
 $('#main').innerHTML=`<div class="head"><h1>${S.label}</h1>${canEdit()?`<button class="btn pri" data-act="add">Add ${S.single}</button>`:''}</div>${toolbar||''}<div class="srch"><input id="q" type="search" placeholder="Search ${S.label.toLowerCase()}" value="${esc(Q[col]||'')}"></div>${chips}<div id="list"></div>`;
 refreshList();
}

function nextMeeting(){return D.meetings.filter(m=>m.date>=today()&&m.type!=='Announcement').sort(byDateAsc)[0]}
function vAssign(){
 if(SEL!=='all'&&!meet(SEL))SEL=(nextMeeting()||{}).id||'all';
 const opts=D.meetings.slice().sort(byDateAsc).map(m=>`<option value="${esc(m.id)}"${m.id===SEL?' selected':''}>${esc(meetLabel(m))}</option>`).join('');
 const tb=`<div class="tb"><select id="msel" aria-label="Meeting"><option value="all"${SEL==='all'?' selected':''}>All meetings</option>${opts}</select>${canEdit()?'<button class="btn sm" data-act="stdparts">Add standard parts</button><button class="btn sm gold" data-act="auto">Auto-assign</button>':''}</div>`;
 vList('assignments',tb);
}

async function hashPw(pw,salt){
 const s=salt+pw;
 if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h;
}

async function doImport(d,replace){
 closeModal();toast('Importing');
 try{
  if(MODE==='cloud'){
   for(const c of COLS){
    const inc=(d[c]||[]).map(x=>({...x,id:x.id||uid()}));
    if(replace){const {error:de}=await SB.from('app_records').delete().eq('collection_name',c);if(de)throw de;}
    if(inc.length){const rows=inc.map(x=>({collection_name:c,record_id:String(x.id),payload:x,owner_email:PERSONAL.includes(c)?(x.owner||ME.email):null,updated_at:new Date().toISOString()}));const {error}=await SB.from('app_records').upsert(rows,{onConflict:'collection_name,record_id'});if(error)throw error;}
   }
  }else{
   COLS.forEach(c=>{
    const inc=(d[c]||[]).map(x=>({...x,id:x.id||uid()}));
    if(replace)D[c]=inc;else{const m=new Map(D[c].map(x=>[x.id,x]));inc.forEach(x=>m.set(x.id,x));D[c]=[...m.values()]}

 }catch(e){err(e)}

function autoAssign(){

  const stat=p=>{let cnt=0,last='';D.assignments.forEach(o=>{if(o.person!==p.id||o.role!==a.role)return;const om=meet(o.meeting);if(!om)return;if(om.date>=from)cnt++;if(om.date>last)last=om.date});return{p,cnt,last}};
  const pool=D.publishers.filter(p=>!p.quals||!p.quals.length||p.quals.includes(a.role)).filter(p=>!conflicts({...a,person:p.id}).length).map(stat).sort((x,y)=>x.cnt-y.cnt||x.last.localeCompare(y.last));
  if(pool.length){a.person=pool[0].p.id;a.status='Pending';a.updated=new Date().toISOString();saveRec('assignments',a);n++}else skip++;
 });
 toast(`${n} assigned${skip?`, ${skip} need a manual pick`:''}`);render();
}

function slotsOf(col,s){
 const L=[],add=(label,role,get,set,x)=>L.push(Object.assign({label,role,get,set},x||{}));
 if(col==='clm'){

   add(r.label,main,()=>r.person,v=>r.person=v,x);
   if(r.kind==='apply')add(r.label+' (assistant)','Assistant',()=>r.asst,v=>r.asst=v,x);
   if(r.kind==='cbs')add('Bible study reader','Reading',()=>r.asst,v=>r.asst=v,x);
   if(s.aux&&(r.kind==='read'||r.kind==='apply'||r.kind==='stalk')){
    add(r.label+' (auxiliary)',main,()=>r.auxPerson,v=>r.auxPerson=v,x);
    if(r.kind==='apply')add(r.label+' (auxiliary assistant)','Assistant',()=>r.auxAsst,v=>r.auxAsst=v,x);
   }
  });
  add('Closing prayer','Prayer',()=>s.prayerClose,v=>s.prayerClose=v,{pos:'end',sec:'Closing'});
 }else{
  const x={sec:'Weekend meeting'};
  add('Chairman','Chairman',()=>s.chairman,v=>s.chairman=v,x);
  add('Public talk speaker','Talk',()=>s.speaker,v=>s.speaker=v,Object.assign({locked:!!s.speakerName&&!s.speaker},x));
  add('Second speaker (optional)','Talk',()=>s.coSpeaker,v=>s.coSpeaker=v,Object.assign({opt:true},x));
  add('Watchtower Study conductor','Conductor',()=>s.wtConductor,v=>s.wtConductor=v,x);
  add('Watchtower Study reader','Reading',()=>s.wtReader,v=>s.wtReader=v,x);

  add('Hospitality','Duty',()=>s.hospitality,v=>s.hospitality=v,x);
 }

function sheetWarn(s,L){
 const w=L.map(()=>[]),seen={};
 L.forEach((sl,i)=>{
  const p=sl.get();if(!p)return;(seen[p]=seen[p]||[]).push(i);
  const pb=pub(p);if(pb&&isAway(pb,s.date))w[i].push(pb.name+' is away on this date');
  if(D.awaytalks.some(a=>a.speaker===p&&a.date===s.date))w[i].push('Giving a talk in another congregation');
 });
 Object.values(seen).forEach(ix=>{if(ix.length>1)ix.forEach(i=>w[i].push('Has '+ix.length+' parts in this meeting'))});
 return w;
}
function autoFill(col,s){
 const L=slotsOf(col,s),from=addDays(today(),-90),hist=[];
 ['clm','weekend'].forEach(c=>D[c].forEach(sh=>{if(sh.id===s.id)return;slotsOf(c,sh).forEach(sl=>{const p=sl.get();if(p)hist.push({p,role:sl.role,date:sh.date||''})})}));
 let n=0,skip=0;
 L.forEach(sl=>{
  if(sl.get()||sl.locked||sl.opt)return;
  const taken=new Set(L.map(x=>x.get()).filter(Boolean));
  const cand=D.publishers.filter(p=>!taken.has(p.id)&&(!p.quals||!p.quals.length||p.quals.includes(sl.role))&&!isAway(p,s.date)&&!D.awaytalks.some(a=>a.speaker===p.id&&a.date===s.date))
   .map(p=>{const h=hist.filter(x=>x.p===p.id&&x.role===sl.role);return{p,cnt:h.filter(x=>x.date>=from).length,last:h.reduce((m,x)=>x.date>m?x.date:m,'')}})
   .sort((a,b)=>a.cnt-b.cnt||a.last.localeCompare(b.last));
  if(cand.length){sl.set(cand[0].p.id);n++}else skip++;
 });
 return{n,skip};
}

function genYear(col){

 if(!canEdit()){toast('Only editors can generate meetings');return}
 const isC=col==='clm',last=D[col].slice().sort(byDateAsc).pop();
 const dow0=last?new Date(last.date+'T00:00').getDay():(isC?3:6),start0=last?addDays(last.date,1):today();
 modal(`<h2>Generate a year of ${isC?'Life and Ministry':'weekend'} meetings</h2><p class="mute" style="margin-bottom:12px">Creates an empty sheet for every week, one year from the start date${last?', which is the day after your last sheet':''}. Weeks that already have a sheet are kept.</p><form id="gf"><div class="two"><div class="fld"><label for="gd">Meeting day</label><select id="gd">${DAYS.map((d,i)=>`<option value="${(i+1)%7}"${(i+1)%7===dow0?' selected':''}>${d}</option>`).join('')}</select></div><div class="fld"><label for="gs">Start date</label><input id="gs" type="date" value="${start0}" required></div></div>${isC?`<div class="fld"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="ga"${last&&last.aux?' checked':''}> Auxiliary classroom in use</label></div><div class="fld"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="gr" checked> Continue the group (Kuu) rotation</label></div>`:''}<div class="acts"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn pri">Generate</button></div></form>`);
 $('#gf').onsubmit=e=>{
  e.preventDefault();
  const dow=+$('#gd').value,start=$('#gs').value,end=addDays(start,365),have=new Set(D[col].map(x=>mondayOf(x.date))),ds=[];
  let d=start;while(new Date(d+'T00:00').getDay()!==dow)d=addDays(d,1);
  for(;d<=end;d=addDays(d,7)){
   if(have.has(mondayOf(d)))continue;
   if(!isC&&D.meetings.some(m=>m.date===d&&m.title===WK_EVENT.title))continue;
   ds.push(d);
  }
  const gl=D.groups.slice().sort(SCHEMA.groups.sort),rot=isC&&$('#gr').checked&&gl.length>0;
  let gi=0;
  if(rot){const ref=D.clm.filter(x=>x.group&&x.date<(ds[0]||start)).sort(byDateAsc).pop(),ix=ref?gl.findIndex(g=>g.id===ref.group):-1;gi=ix+1}
  ds.forEach(dd=>{

 });

 D.publishers.filter(p=>docGroups.has(p.group)&&!inDoc.has(p.id)).forEach(p=>{cleared.push(p.name);saveRec('publishers',{...p,group:'',updated:stamp()})});

  +(mv.length?`<h3 style="margin:10px 0 6px">Moved</h3><div class="tw" style="max-height:240px;overflow:auto"><table class="tbl"><tbody>${mv.map(m=>`<tr><td>${esc(m[0])}</td><td>${esc(m[1])} to Group ${m[2]}</td></tr>`).join('')}</tbody></table></div>`:'')

const normName=n=>String(n).toLowerCase().replace(/[.\-]/g,' ').replace(/\s+/g,' ').trim();
function osa(a,b){
 if(a===b)return 0;const m=a.length,n=b.length;
 const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
  d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
 }
 return d[m][n];
}
function makeResolver(docNames,rep,noCreate){
 const doc=new Set(docNames.filter(Boolean).map(normName));
 return name=>{
  if(!name)return '';
  const n=normName(name),toks=n.split(' '),all=D.publishers.map(p=>({p,n:normName(p.name)}));
  let hit=all.find(x=>x.n===n),how='';
  if(!hit){const k=toks.slice().sort().join(' ');hit=all.find(x=>x.n.split(' ').sort().join(' ')===k)}
  if(!hit&&toks.length>=2){
   hit=all.find(x=>{
    if(doc.has(x.n))return false;const t=x.n.split(' ');
    if(t.length<2||t[0]!==toks[0]||t[t.length-1]!==toks[toks.length-1])return false;
    const [a,b]=t.length<toks.length?[t,toks]:[toks,t];return a.every(w=>b.includes(w));
   });
   if(hit)how='name';
  }
  if(!hit&&n.length>=8){hit=all.find(x=>!doc.has(x.n)&&x.n[0]===n[0]&&osa(x.n,n)<=1);if(hit)how='spelling'}
  if(!hit&&toks.length>=2&&toks[0].length>=4&&toks[toks.length-1].length>=4){
   const c=all.filter(x=>{if(doc.has(x.n))return false;const u=x.n.split(' ');return u.length>=2&&u[0].length>=4&&u[u.length-1].length>=4&&osa(u[0],toks[0])<=1&&osa(u[u.length-1],toks[toks.length-1])<=2});
   if(c.length===1){hit=c[0];how='spelling'}
  }
  if(hit){if(how&&!rep.fuzzy.some(f=>f[0]===name))rep.fuzzy.push([name,hit.p.name]);return hit.p.id}
  if(noCreate){rep.missing.push(String(name).trim());return ''}
  const p={id:uid(),owner:ME.email,name:String(name).trim(),phone:'',email:'',group:'',privilege:'',quals:[],awayFrom:'',awayUntil:'',notes:'',updated:stamp()};
  saveRec('publishers',p);if(!rep.created.includes(p.name))rep.created.push(p.name);return p.id;
 };
}

function loadState(){
  const rec = (typeof D !== 'undefined' && D.litstate || []).find(x=>x.id==='main');
  if(!rec || !rec.data) return DEFAULT_STATE();
  try{
    const parsed = JSON.parse(JSON.stringify(rec.data));
    const seed = DEFAULT_STATE();
    return {
      congregation: parsed.congregation || seed.congregation,
      languages: Array.isArray(parsed.languages) ? parsed.languages : seed.languages,
      categories: Array.isArray(parsed.categories) ? parsed.categories : seed.categories,
      requests: Array.isArray(parsed.requests) ? parsed.requests : [],
      recurringRequests: Array.isArray(parsed.recurringRequests) ? parsed.recurringRequests : seed.recurringRequests,
      shipments: Array.isArray(parsed.shipments) ? parsed.shipments : [],
      inventory: Array.isArray(parsed.inventory) ? parsed.inventory : seed.inventory,
      inventoryReport: parsed.inventoryReport || seed.inventoryReport,
      rotation: (parsed.rotation && Array.isArray(parsed.rotation.publishers)) ? {...seed.rotation, ...parsed.rotation} : seed.rotation,
      monthlyMovement: Array.isArray(parsed.monthlyMovement) ? parsed.monthlyMovement : seed.monthlyMovement,
      masterPublications: Array.isArray(parsed.masterPublications) ? parsed.masterPublications : seed.masterPublications,
      otherPubs: Array.isArray(parsed.otherPubs) ? parsed.otherPubs : [],
      guidelines: Array.isArray(parsed.guidelines) && parsed.guidelines.length ? parsed.guidelines : seed.guidelines,
    };
  }catch(e){ return DEFAULT_STATE(); }
}

  if(!canEdit()){ toast('Only editors can change literature records.'); state = loadState(); setTimeout(render,0); return; }

}

function esc(str){ return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function toast(msg){
  const host = document.getElementById('toastHost');
  if(!host) return;
  host.innerHTML = `<div class="toast" role="status" aria-live="polite">${esc(msg)}</div>`;
  clearTimeout(window._t);

}

let drawer = null, scrim = null;
function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); drawer.setAttribute('aria-hidden','false'); document.getElementById('drawerBtn').setAttribute('aria-expanded','true'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); document.getElementById('drawerBtn').setAttribute('aria-expanded','false'); }
let recurringHint = null;
function bindShell(){
  drawer = document.getElementById('drawer'); scrim = document.getElementById('scrim');
  document.getElementById('drawerBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

    btn.addEventListener('click', ()=>{
      if(!pageAllowedForRole(btn.dataset.page)){ toast('Not available for your role.'); return; }

      currentPage = btn.dataset.page;

/* ============================================================
   LITERATURE DISPLAY ROTATION
   Rotation data (publisher order, meeting time, coordinator &
   overseer names) is stored locally on this device in
   state.rotation (localStorage), same as the rest of the app's data.
============================================================= */
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function currentRotationIndex(){
  const r = state.rotation;
  if(!r.publishers.length) return -1;
  return isoWeek(new Date()) % r.publishers.length;
}
function canManageRotation(){ return true; }
function canShareRotation(){ return true; }
function renderRotationLive(){ /* rotation lives in local state; nothing to fetch */ }
function myDutyBlock(){
  if(!currentUser || currentUser.role !== 'publisher') return '';
  const r = state.rotation;
  const idx = currentRotationIndex();
  const myIdx = r.publishers.findIndex(p => p.trim().toLowerCase() === currentUser.full_name.trim().toLowerCase());
  const isMe = myIdx >= 0 && myIdx === idx;
  let nextText = '\u2014';
  if(myIdx >= 0 && r.publishers.length){
    let stepsAhead = (myIdx - idx + r.publishers.length) % r.publishers.length;
    if(stepsAhead === 0) stepsAhead = r.publishers.length;
    const weeksOut = stepsAhead;
    nextText = weeksOut === r.publishers.length && isMe ? 'This week' : `In ${weeksOut} week${weeksOut===1?'':'s'}`;
  }
  return `
    <div class="duty-card">
      <div class="duty-eyebrow">My Literature Display Duty</div>
      <div class="duty-name">${isMe ? "You're on duty this week" : 'You are not assigned this week'}</div>
      ${!isMe ? `<div class="subtext" style="color:#E7B98A;margin-top:.3rem;">Next time you are scheduled: ${myIdx>=0 ? esc(nextText) : 'not currently on the rotation list'}.</div>` : ''}
      <div class="duty-grid">
        <div><div class="duty-label">Meeting Time</div><div class="duty-val">${esc(r.meetingTime || '\u2014')}</div></div>
        <div><div class="duty-label">Next Assignment</div><div class="duty-val">${esc(nextText)}</div></div>
      </div>
    </div>`;
}
function pageRotation(){
  const r = state.rotation;
  const idx = currentRotationIndex();
  const onDuty = idx >= 0 ? r.publishers[idx] : null;
  const nextIdx = idx >= 0 ? (idx + 1) % r.publishers.length : -1;
  const nextUp = nextIdx >= 0 ? r.publishers[nextIdx] : null;

  return `
    <div class="eyebrow">Literature Display</div>
    <h1 class="page-title">Weekly Rotation</h1>

    <section style="margin-top:1rem;">
      <div class="duty-card">
        <div class="duty-eyebrow">This Week's Literature Display</div>
        <div class="duty-name">${onDuty ? esc(onDuty) : '\u2014'}</div>
        <div class="duty-grid">
          <div><div class="duty-label">Meeting Time</div><div class="duty-val">${esc(r.meetingTime || '\u2014')}</div></div>
          <div><div class="duty-label">Next Week</div><div class="duty-val">${nextUp ? esc(nextUp) : '\u2014'}</div></div>
        </div>
      </div>
    </section>

    ${myDutyBlock()}

    <section>
      <div class="eyebrow-label">Full Rotation</div>
      <div class="item-list">
        ${r.publishers.map((p,i) => `
          <div class="item-card" style="${i===idx ? 'border:1px solid var(--accent);' : ''}">
            <div class="item-name">${i+1}. ${esc(p)}</div>
            ${i===idx ? `<span class="pill pill-ok">This week</span>` : ''}
          </div>
        `).join('')}
        ${!r.publishers.length ? `<div class="lempty">No publishers on the rotation yet.</div>` : ''}
      </div>
    </section>

    <section>
      <div class="eyebrow-label">Coordinator &amp; Overseer</div>
      <div class="item-list">
        <div class="item-card"><div><div class="item-name">${esc(r.coordinator || '\u2014')}</div><div class="item-sub">Coordinator</div></div></div>
        <div class="item-card"><div><div class="item-name">${esc(r.overseer || '\u2014')}</div><div class="item-sub">Overseer</div></div></div>
      </div>
    </section>

    ${canManageRotation() ? `
    <section>
      <div class="eyebrow-label">Manage Rotation</div>
      <div class="subtext" style="margin-top:0;">Edit the publisher order and meeting time. Changes save to the shared roster for everyone.</div>
      <button class="lbtn btn-primary btn-block" style="margin-top:.8rem;" onclick="LIT.openEditRotationModal()">Edit Rotation</button>
    </section>` : ''}

    <section>
      <div class="eyebrow-label">Share</div>
      <div class="subtext" style="margin-top:0;">${canShareRotation() ? 'You are authorized to share this schedule outside the app.' : 'Viewing only — sharing is limited to the Overseer, Coordinator, and anyone they authorize.'}</div>
      ${canShareRotation() ? `<button class="lbtn btn-primary btn-block" style="margin-top:.8rem;" onclick="LIT.attemptShareRotation()">Share Schedule</button>` : ''}
    </section>
  `;
}
function rotationShareText(){
  const r = state.rotation;
  const idx = currentRotationIndex();
  const lines = [
    `Literature Display Rotation — ${state.congregation.name}`,
    `Publishers rotate weekly to display literature before meetings start at ${r.meetingTime}.`,
    ``,
    `This week on duty: ${idx>=0 ? r.publishers[idx] : '—'}`,
    ``,
    `Rotation order:`,
    ...r.publishers.map((p,i)=> `${i+1}. ${p}${i===idx ? '  <- this week' : ''}`),
    ``,
    `Coordinator: ${r.coordinator}`,
    `Overseer: ${r.overseer}`,
  ];
  return lines.join('\n');
}
async function attemptShareRotation(){
  if(!canShareRotation()){ toast('You are not authorized to share this schedule.'); return; }
  const text = rotationShareText();
  try{
    if(navigator.share){
      await navigator.share({ title:'Literature Display Rotation', text });
      toast('Schedule shared.');
      return;
    }
  }catch(e){ /* user cancelled share sheet — fall through to copy */ }
  try{
    await navigator.clipboard.writeText(text);

   else{const u=getUsers().find(x=>x.email===em);if(!u||u.hash!==await hashPw(pw,u.salt)){showAuth('Wrong email or password.');return}localSignIn(em)}
  }catch(x){showAuth(niceErr(x))}
 };
